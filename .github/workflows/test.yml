name: Update README Version

on:
  workflow_dispatch: # 手動トリガー

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.0.41 # 必要に応じて変更

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3

      - name: Update README version
        run: |
          # 古い HEADER ブロックをすべて削除
          sed -i '/<!--HEADER-->/,/<!--\/HEADER-->/d' README.md

          # 新しい HEADER ブロックを先頭に直接追加（変数展開も可能）
          awk -v ver="${{ env.VERSION }}" 'BEGIN {
            print "<!--HEADER-->"
            print "![Release version](https://img.shields.io/badge/version-" ver "-blue) Latest release: [<!--LATEST_VERSION-->" ver "<!--/LATEST_VERSION-->](https://github.com/RyOkEeeesh/pong/releases/latest)"
            print ""
            print "# PONG " ver
            print "<!--/HEADER-->"
            print ""
          } { print }' README.md > tmp.md && mv tmp.md README.md

          # Git の設定・コミット・プッシュ
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "docs: update README version to ${{ env.VERSION }}"
          git push origin HEAD:main
