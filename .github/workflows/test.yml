name: Update README Version

on:
  workflow_dispatch: # 手動でトリガー

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.0.41 # 必要に応じて変更

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3

      - name: Update version in README.md
        run: |
          cat > header.txt <<'EOF'
          <!--HEADER-->
          ![Release version](https://img.shields.io/badge/version-<!--THIS_VERSION-->v0.0.0<!--/THIS_VERSION-->-blue) Latest release: [<!--LATEST_VERSION-->v0.0.0<!--/LATEST_VERSION-->](https://github.com/RyOkEeeesh/pong/releases/latest)

          # PONG <!--THIS_VERSION-->v0.0.0<!--/THIS_VERSION-->
          <!--/HEADER-->
          EOF

          # sed で安全に置換
          sed -i "/<!--HEADER-->/,/<!--\/HEADER-->/{
            r header.txt
            d
          }" README.md

          rm header.txt

          # バージョン番号を更新
          sed -i "s/<!--THIS_VERSION-->.*<!--\/THIS_VERSION-->/${{ env.VERSION }}/" README.md
          sed -i "s/<!--LATEST_VERSION-->.*<!--\/LATEST_VERSION-->/<!--LATEST_VERSION-->${{ env.VERSION }}<!--\/LATEST_VERSION-->/" README.md

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "docs: update README version to ${{ env.VERSION }}"
          git push origin HEAD:main
