name: Tag Build & Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      VERSION_NUMBER: ${{ github.ref_name }}
      VERSION_BRANCH: release/${{ github.ref_name }}

      # vite
      VITE_COOKIE_DOMAIN: ${{ secrets.VITE_COOKIE_DOMAIN }}
      VITE_COOKIE_PATH: ${{ secrets.VITE_COOKIE_PATH }}
      VITE_COOKIE_SECURE: ${{ secrets.VITE_COOKIE_SECURE }}
      VITE_SECRET_KEY: ${{ secrets.VITE_SECRET_KEY }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version and push to main
        run: |
          VERSION_NUM=${VERSION_NUMBER#v}
          jq ".version = \"$VERSION_NUM\"" package.json > tmp.json && mv tmp.json package.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add package.json
          git commit -m "chore: bump version to $VERSION_NUM"
          git push origin HEAD:main

      - name: Update version in README.md
        run: |
          sed -i '/<!--HEADER-->/,/<!--\/HEADER-->/d' README.md

          awk -v ver="${{ env.VERSION }}" 'BEGIN {
            print "<!--HEADER-->"
            print "![Release version](https://img.shields.io/badge/version-" ver "-blue) Latest release: [<!--LATEST_VERSION-->" ver "<!--/LATEST_VERSION-->](https://github.com/RyOkEeeesh/pong/releases/latest)"
            print ""
            print "# PONG " ver
            print "<!--/HEADER-->"
            print ""
          } { print }' README.md > tmp.md && mv tmp.md README.md

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "docs: update README version to ${{ env.VERSION }}"
          git push origin HEAD:main


      - name: Create and push release branch
        run: |
          git checkout -b $VERSION_BRANCH
          git push origin $VERSION_BRANCH

      - name: Build the project
        run: npm run build

      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll

      - name: Deploy built files to gh-pages (latest release)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Zip dist/ folder
        run: |
          cd dist
          zip -r ../dist.zip .

      - name: Upload dist.zip to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            🚀 Auto-generated release for version ${{ github.ref_name }}.
          files: dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in README.md for all branches
        run: |
          git fetch origin

          for branch in $(git branch -r | grep -v '\->'); do
              branch_name=${branch#origin/}

              echo "Checking out $branch_name"
              git switch $branch_name || continue

              # README.md が存在しないブランチはスキップ
              if [ ! -f README.md ]; then
                  echo "README.md not found in $branch_name, skipping..."
                  continue
              fi

              # バージョン書き換え
              sed -i "s/<!--LATEST_VERSION-->.*<!--\/LATEST_VERSION-->/<!--LATEST_VERSION-->${VERSION}<!--\/LATEST_VERSION-->/" README.md

              git config user.name "github-actions"
              git config user.email "actions@github.com"

              if ! git diff --quiet; then
                  git add README.md
                  git commit -m "docs: update README version to ${VERSION}"
                  git push origin $branch_name
              else
                  echo "No changes to commit for branch $branch_name"
              fi
          done