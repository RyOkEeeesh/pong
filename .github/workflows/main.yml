name: Deploy to Version Branch and GitHub Pages

on:
  push:
    tags:
      - 'v*' # タグ形式 v1.2.3 のときに実行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracted version: $VERSION"

      - name: Build project
        run: npm run build

      - name: Add .nojekyll to dist
        run: touch dist/.nojekyll

      - name: Deploy to version branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: v${{ github.ref_name }}
          publish_dir: ./dist

      - name: Update GitHub Pages branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin
          git checkout -b gh-pages
          cp -r dist/* .
          git add .
          git commit -m "Update GitHub Pages to v${GITHUB_REF#refs/tags/v}"
          git push origin gh-pages --force